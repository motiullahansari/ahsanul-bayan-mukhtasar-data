<title>Mukhtasar Ahsanul Bayan App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B5A3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: a 390×844 phone on desktop, full-screen app on a real phone; green app bar, gold ornaments from the icon */
:root{
  --desk:#E9ECE8; --bg:#FDFCF7; --card:#FFFFFF; --ink:#1C2620; --muted:#5E6862; --line:#E8E2D3;
  --green:#0B5A3A; --green-2:#0E6B46; --gold:#B8893A; --gold-ink:#8C6420; --gold-soft:#F4ECDB;
  --on-green:#FFFFFF; --title:#0B5A3A; --danger:#B3261E; --frame:#121614;
  --f-display:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  --f-body:"Noto Sans Devanagari","Amiri",system-ui,sans-serif;
  --f-label:"Cinzel","Times New Roman",serif;
  --f-arabic:"Amiri",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0A0E0C; --bg:#0F1512; --card:#161E1A; --ink:#E7ECE8; --muted:#A3AEA7; --line:#26322C;
  --green:#0E5C3D; --green-2:#13774F; --gold:#D3A657; --gold-ink:#D9B26B; --gold-soft:#2A2618;
  --on-green:#F2F6F3; --title:#E7ECE8; --danger:#F2B8B5; --frame:#2A322E; color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#0A0E0C; --bg:#0F1512; --card:#161E1A; --ink:#E7ECE8; --muted:#A3AEA7; --line:#26322C;
  --green:#0E5C3D; --green-2:#13774F; --gold:#D3A657; --gold-ink:#D9B26B; --gold-soft:#2A2618;
  --on-green:#F2F6F3; --title:#E7ECE8; --danger:#F2B8B5; --frame:#2A322E; color-scheme:dark }

html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}

/* device: exact 390×844 screen inside a 12px bezel, scaled as a whole to fit the window */
.stage{width:calc(414px * var(--s,1));height:calc(868px * var(--s,1));flex:none}
.device{width:414px;height:868px;box-sizing:border-box;padding:12px;border-radius:60px;background:var(--frame);
  box-shadow:0 30px 80px rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.06);transform:scale(var(--s,1));transform-origin:top left}
.phone{width:390px;height:844px;background:var(--bg);border-radius:48px;overflow:hidden;position:relative;--sb:47px;--hi:34px}
.statusbar{position:absolute;inset:0 0 auto;height:var(--sb);z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:0 30px 0 34px;font:600 15px/1 system-ui,-apple-system,sans-serif;color:var(--ink);transition:background .35s,color .35s;pointer-events:none}
.phone.sb-green .statusbar{background:var(--green);color:var(--on-green)}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:31}
.homebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:30;pointer-events:none}
.screens{position:absolute;inset:var(--sb) 0 0 0}
/* real phone: no bezel, no fake bars, fill the screen */
@media (max-width:480px){
  body{padding:0;display:block}
  .stage{width:100%;height:100%}
  .device{width:100%;height:100%;padding:0;border-radius:0;box-shadow:none;transform:none;background:var(--bg)}
  .phone{width:100%;height:100%;border-radius:0;--sb:0px;--hi:0px}
  .statusbar,.island,.homebar{display:none}
}
/* splash */
.splash{align-items:center;justify-content:space-between;padding:0 28px;padding-block:72px calc(var(--hi) + 24px);text-align:center}
.splash .mid{display:flex;flex-direction:column;align-items:center;gap:24px;margin-top:40px}
.logo{border-radius:22%;background:#FDFCF7;box-shadow:0 16px 36px rgba(11,90,58,.16)}
.splash .logo{width:180px;height:180px;animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:none;opacity:1}}
h1.name{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.25;color:var(--title);margin:0}
.tag{color:var(--muted);margin:0}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;width:60px;background:currentColor;opacity:.7}
.orn i{width:7px;height:7px;background:currentColor;transform:rotate(45deg)}
.brand{font-family:var(--f-label);font-size:11px;letter-spacing:.22em;color:var(--gold-ink)}
.ver{font-size:12px;color:var(--muted)}

/* download */
.dl{align-items:center;padding:0 28px;padding-block:64px calc(var(--hi) + 20px);gap:24px;text-align:center;overflow:auto}
.dl .logo{width:128px;height:128px}
.dl p{color:var(--muted);margin:0;max-width:30ch}
.prog{width:100%;display:flex;flex-direction:column;gap:8px}
.prog .top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.prog .top b{color:var(--title);font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--gold-soft);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:99px;background:var(--green);transition:width .2s}
.prog .mb{font-size:12.5px;color:var(--muted);text-align:left;font-variant-numeric:tabular-nums}
.facts{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;font-size:14px}
.facts div{display:flex;gap:12px;align-items:center}
.facts svg{flex:none;color:var(--green)}
.err{color:var(--danger)}
.btn{border:0;background:var(--green);color:var(--on-green);border-radius:14px;padding:12px 22px;font-weight:500;min-height:44px}
.hint{margin-top:auto;font-size:12.5px;color:var(--muted)}

/* home */
.appbar{background:var(--green);color:var(--on-green);padding:8px 16px 0;padding-top:max(8px,env(safe-area-inset-top,0px))}
.appbar .row1{display:flex;align-items:center;gap:12px}
.appbar .logo{width:42px;height:42px;border-radius:11px;box-shadow:none}
.appbar h2{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.2;margin:0}
.appbar .sub{font-size:12px;color:var(--gold-soft);opacity:.9}
.appbar .grow{flex:1;min-width:0}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--on-green);flex:none}
.ib:hover{background:rgba(255,255,255,.12)}
.searchbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:12px;padding:0 12px;height:42px;margin-top:12px}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--on-green);font:inherit;outline:none}
.searchbox input::placeholder{color:rgba(255,255,255,.75)}
.tabs{display:flex;margin-top:10px}
.tabs button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.78);padding:12px 0 10px;border-bottom:3px solid transparent;font-weight:500;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--on-green);border-bottom-color:var(--gold)}

.body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(calc(var(--hi) + 8px),env(safe-area-inset-bottom,0px))}
.cont{margin:14px 16px 6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;width:calc(100% - 32px);box-sizing:border-box}
.cont .k{font-family:var(--f-label);font-size:10.5px;letter-spacing:.16em;color:var(--gold-ink)}
.cont .t{font-family:var(--f-display);font-size:19px;line-height:1.3}
.cont .m{font-size:12.5px;color:var(--muted)}
.cont .go{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;flex:none}
.lbl{font-family:var(--f-label);font-size:10.5px;letter-spacing:.16em;color:var(--gold-ink);padding:14px 20px 4px}
.item{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);min-height:64px}
.item:active{background:var(--gold-soft)}
.num{width:40px;height:40px;flex:none;position:relative;display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:13px;color:var(--title);font-variant-numeric:tabular-nums}
.num::before,.num::after{content:"";position:absolute;inset:6px;border:1.5px solid var(--gold);border-radius:5px}
.num::after{transform:rotate(45deg)}
.item .t{flex:1;min-width:0}
.item .n{font-family:var(--f-display);font-size:17.5px;line-height:1.3}
.item .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex:none;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;padding:0 8px;border-radius:99px;border:1px solid var(--line);margin-bottom:2px}
.empty{color:var(--muted);text-align:center;padding:48px 24px}

.toast{position:absolute;left:16px;right:16px;bottom:max(calc(var(--hi) + 12px),env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:14px;
  transform:translateY(140%);transition:transform .3s ease;z-index:20}
.toast.on{transform:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

let good = null;
async function fetchText(p) { const order = good ? [good, ...BASES.filter(b => b !== good)] : BASES; let last;
  for (const b of order) { try { const r = await fetch(b + p, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); const t = await r.text(); good = b; return t; } catch (e) { last = e; } }
  throw last || new Error("net"); }
async function sha(t) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); } catch { return null; } }

/* ---------- screen helper ---------- */
let current = null;
function show(el, green) {
  phoneEl.classList.toggle("sb-green", !!green);
  el.classList.add("screen", "out"); phone.append(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("out")));
  if (current) { const old = current; old.classList.add("out"); setTimeout(() => old.remove(), 400); }
  current = el;
}
function toast(msg) {
  let t = phone.querySelector(".toast"); if (!t) { t = $(`<div class="toast" role="status"></div>`); phone.append(t); }
  t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200);
}

/* ---------- 1. splash ---------- */
function splash() {
  show($(`<section class="splash" aria-label="Splash">
    <div class="mid">
      <img class="logo" src="${LOGO}" alt="मुख्तसर अहसनुल बयान">
      <div><h1 class="name">मुख्तसर अहसनुल बयान</h1><p class="tag">हिन्दी अनुवाद व तफ़सीर</p></div>
      <div class="orn" aria-hidden="true"><i></i></div>
    </div>
    <div><div class="brand">UMMAHTECH</div><div class="ver">संस्करण 1.0</div></div>
  </section>`));
}

/* ---------- 2. first download ---------- */
function download() {
  const el = $(`<section class="dl" aria-label="Download">
    <img class="logo" src="${LOGO}" alt="">
    <div><h1 class="name" style="font-size:27px">मुख्तसर अहसनुल बयान</h1></div>
    <p id="msg">पहली बार डेटा डाउनलोड हो रहा है। इसके बाद ऐप बिना इंटरनेट चलेगा।</p>
    <div class="prog">
      <div class="top"><span id="cnt">शुरू हो रहा है…</span><b id="pct">0%</b></div>
      <div class="track" role="progressbar" aria-label="डाउनलोड" aria-valuemin="0" aria-valuemax="100"><i id="bar"></i></div>
      <div class="mb" id="mb">0 / 6.3 MB</div>
    </div>
    <div class="facts">
      <div>${I.check}<span>114 सूरह, 6236 आयतें</span></div>
      <div>${I.check}<span>2424 तफ़सीरी नोट्स</span></div>
      <div style="color:var(--gold-ink)">${I.down}<span style="color:var(--ink)">सिर्फ़ एक बार डाउनलोड</span></div>
    </div>
    <div class="hint">वाई-फ़ाई पर डाउनलोड करना बेहतर है</div>
  </section>`);
  show(el);
  const q = (s) => el.querySelector(s);
  (async () => {
    try {
      const mt = await fetchText("manifest.json"); const m = JSON.parse(mt);
      const total = m.total_bytes, files = m.files.slice(); let done = 0, n = 0; const N = files.length;
      const tick = () => { const p = done / total; q("#bar").style.width = (p * 100).toFixed(1) + "%"; q("#pct").textContent = Math.round(p * 100) + "%";
        q(".track").setAttribute("aria-valuenow", Math.round(p * 100)); q("#mb").textContent = `${(done / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`;
        q("#cnt").textContent = `फ़ाइल ${n} / ${N}`; };
      await Promise.all(Array.from({ length: 6 }, async () => { while (files.length) { const f = files.shift(); const t = await fetchText(f.path);
        const h = await sha(t); if (h && h !== f.sha256) throw new Error("hash"); await put(f.path, t); done += f.bytes; n++; tick(); } }));
      await put("manifest.json", mt);
      setTimeout(boot, 350);
    } catch (e) {
      q("#msg").textContent = "डाउनलोड नहीं हो सका। इंटरनेट चेक करके दोबारा कोशिश करें।"; q("#msg").classList.add("err");
      q(".prog").after($(`<p style="font-size:12px;opacity:.8">कारण: ${esc((e && e.message) || e)}${location.protocol === "file:" ? " · फ़ाइल को सीधे खोलने पर कुछ ब्राउज़र डाउनलोड रोकते हैं — वेब लिंक से खोलें।" : ""}</p>`));
      const b = $(`<button class="btn" type="button">दोबारा कोशिश करें</button>`); b.onclick = download; q(".prog").after(b);
    }
  })();
}

/* ---------- 3. home ---------- */
let surahs = [], tab = "surah", query = "", juzCache = null;
async function loadSurah(n) { const p = `surah/${String(n).padStart(3, "0")}.json`; let t = await get(p); if (t === undefined) { t = await fetchText(p); put(p, t); } return JSON.parse(t); }
async function juzIndex() { if (juzCache) return juzCache; const out = []; let last = 0;
  for (const s of surahs) { const d = await loadSurah(s.n); for (const a of d.ayat) if (a.juz > last) { last = a.juz; out.push({ juz: a.juz, s: s.n, a: a.n, page: a.page }); } if (last >= 30) break; }
  return (juzCache = out); }

function home() {
  const last = ls.get("abm.last", null);
  const ls1 = last ? surahs[last.s - 1] : surahs[0];
  const el = $(`<section aria-label="Home">
    <header class="appbar">
      <div class="row1">
        <img class="logo" src="${LOGO}" alt="">
        <div class="grow"><h2>मुख्तसर अहसनुल बयान</h2><div class="sub">हिन्दी अनुवाद व तफ़सीर</div></div>
        <button class="ib" id="sbtn" type="button" aria-label="खोजें">${I.search}</button>
      </div>
      <label class="searchbox" id="sbox" hidden>${I.search}<input id="q" type="search" placeholder="सूरह का नाम या नंबर" aria-label="सूरह खोजें"><button class="ib" id="sx" type="button" aria-label="खोज बंद करें" style="width:36px;height:36px">${I.close}</button></label>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="t1" aria-selected="${tab === "surah"}">सूरह</button>
        <button type="button" role="tab" id="t2" aria-selected="${tab === "juz"}">पारा</button>
      </div>
    </header>
    <div class="body" id="body"></div>
  </section>`);
  show(el, true);
  const q = (s) => el.querySelector(s);
  q("#t1").onclick = () => { tab = "surah"; q("#t1").setAttribute("aria-selected", true); q("#t2").setAttribute("aria-selected", false); draw(); };
  q("#t2").onclick = () => { tab = "juz"; q("#t2").setAttribute("aria-selected", true); q("#t1").setAttribute("aria-selected", false); draw(); };
  q("#sbtn").onclick = () => { q("#sbox").hidden = false; q("#q").focus(); };
  q("#sx").onclick = (e) => { e.preventDefault(); query = ""; q("#q").value = ""; q("#sbox").hidden = true; draw(); };
  q("#q").oninput = (e) => { query = e.target.value; if (tab !== "surah") q("#t1").click(); else draw(); };

  function open(s, a) { ls.set("abm.last", { s, a: a || 1 }); toast(`${surahs[s - 1].name} — रीडर स्क्रीन अगले स्टेप में बनेगी`); }

  function draw() {
    const body = q("#body"); body.innerHTML = ""; body.scrollTop = 0;
    if (tab === "surah") {
      if (!query) {
        const c = $(`<button class="cont" type="button">
          <span><span class="k">${last ? "पढ़ना जारी रखें" : "यहाँ से शुरू करें"}</span><br>
          <span class="t">${esc(ls1.name)}</span><br><span class="m">सूरह ${ls1.n}${last ? ` · आयत ${last.a}` : ` · ${esc(ls1.meaning)}`}</span></span>
          <span class="go">${I.play}</span></button>`);
        c.onclick = () => open(ls1.n, last?.a); body.append(c);
      }
      const k = query.trim().toLowerCase();
      const items = surahs.filter(s => !k || String(s.n) === k || s.name.toLowerCase().includes(k) || s.meaning.toLowerCase().includes(k));
      body.append($(`<div class="lbl">${k ? items.length + " RESULTS" : "114 SURAH"}</div>`));
      if (!items.length) body.append($(`<div class="empty">“${esc(query)}” से कोई सूरह नहीं मिली।</div>`));
      for (const s of items) {
        const b = $(`<button class="item" type="button"><span class="num">${s.n}</span>
          <span class="t"><span class="n">${esc(s.name)}</span><br><span class="m">${esc(s.meaning)}</span></span>
          <span class="r"><span class="chip">${esc(s.place)}</span><br>${s.ayat_count} आयतें</span></button>`);
        b.onclick = () => open(s.n); body.append(b);
      }
    } else {
      body.append($(`<div class="lbl">30 PARA</div>`));
      const wait = $(`<div class="empty">पारे तैयार हो रहे हैं…</div>`); body.append(wait);
      juzIndex().then(idx => { wait.remove(); for (const j of idx) { const s = surahs[j.s - 1];
        const b = $(`<button class="item" type="button"><span class="num">${j.juz}</span>
          <span class="t"><span class="n">पारा ${j.juz}</span><br><span class="m">${esc(s.name)} · आयत ${j.a} से</span></span>
          <span class="r">पेज ${j.page}</span></button>`);
        b.onclick = () => open(j.s, j.a); body.append(b); } });
    }
  }
  draw();
}

/* ---------- boot ---------- */
async function boot() {
  if (!(await get("manifest.json"))) return download();
  try { surahs = JSON.parse(await get("surahs.json")); } catch { return download(); }
  home();
}
splash();
setTimeout(boot, 1600);
})();
</script>
