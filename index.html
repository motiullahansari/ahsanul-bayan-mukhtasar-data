<title>Mukhtasar Ahsanul Bayan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: one reading column (max 720px) like a pocket mushaf; green header band, gold ornaments from the app icon */
:root{
  --bg:#FBFAF4; --paper:#FFFFFF; --ink:#1C2620; --muted:#66706A; --line:#E6E1D2;
  --green:#0B5A3A; --green-2:#0E6B46; --gold:#B8893A; --gold-soft:#F3EBDA; --note:#F7F3E8;
  --on-green:#FFFFFF; --danger:#B3261E; --title:#0B5A3A;
  --f-display:"Tiro Devanagari Hindi","Noto Sans Devanagari",serif;
  --f-body:"Noto Sans Devanagari","Amiri",system-ui,sans-serif;
  --f-label:"Cinzel","Times New Roman",serif;
  --f-arabic:"Amiri","Noto Naskh Arabic",serif;
  --fs-read:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --paper:#151D19; --ink:#E7ECE8; --muted:#9AA69F; --line:#26322C;
  --green:#0E5C3D; --green-2:#13774F; --gold:#D3A657; --gold-soft:#2A2618; --note:#1B231F;
  --on-green:#F2F6F3; --danger:#F2B8B5; --title:#E7ECE8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1512; --paper:#151D19; --ink:#E7ECE8; --muted:#9AA69F; --line:#26322C;
  --green:#0E5C3D; --green-2:#13774F; --gold:#D3A657; --gold-soft:#2A2618; --note:#1B231F;
  --on-green:#F2F6F3; --danger:#F2B8B5; --title:#E7ECE8; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header band */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--green);color:var(--on-green);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.bar img{width:44px;height:44px;border-radius:11px;flex:none;background:#FDFCF7}
.bar h1{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.2;margin:0}
.bar .sub{font-size:12.5px;color:var(--gold);opacity:.95}
.bar .grow{flex:1;min-width:0}
.icon-btn{background:transparent;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--on-green);flex:none}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.icon-btn svg{width:22px;height:22px}

/* Home */
.tools{display:flex;gap:10px;align-items:center;padding-block:14px 6px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.label{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding-block:10px 4px}

.list{display:flex;flex-direction:column;padding-bottom:28px}
.row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--gold-soft)}
.badge{width:42px;height:42px;flex:none;display:grid;place-items:center;position:relative;font-family:var(--f-label);font-weight:700;font-size:14px;color:var(--green);font-variant-numeric:tabular-nums}
.badge::before,.badge::after{content:"";position:absolute;inset:6px;border:1.5px solid var(--gold);border-radius:5px}
.badge::after{transform:rotate(45deg)}
.row .t{flex:1;min-width:0}
.row .n{font-family:var(--f-display);font-size:18px;line-height:1.3}
.row .m{font-size:13px;color:var(--muted)}
.row .r{text-align:right;font-size:12px;color:var(--muted);flex:none}
.row .r b{display:block;font-family:var(--f-arabic);font-weight:400;font-size:13px;color:var(--gold)}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0}

/* Reader */
.toggle{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:0;border-radius:99px;padding:6px 10px 6px 12px;color:var(--on-green);font-size:13px;flex:none}
.sw{width:34px;height:20px;border-radius:99px;background:rgba(255,255,255,.35);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--gold)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}

.head{padding-block:22px 8px;text-align:center}
.head .ar{font-family:var(--f-label);letter-spacing:.2em;font-size:11px;color:var(--gold);text-transform:uppercase}
.head h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 2px;color:var(--title);text-wrap:balance}
.head .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);margin:14px 0 4px}
.orn::before,.orn::after{content:"";height:1px;width:72px;background:currentColor;opacity:.6}
.orn i{width:7px;height:7px;background:currentColor;transform:rotate(45deg)}
.bism{text-align:center;padding-block:6px 14px}
.bism .a{font-family:var(--f-arabic);font-size:26px;color:var(--ink);direction:rtl}
.bism .h{font-size:13px;color:var(--muted)}

.tools2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:6px;border-block:1px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
.tools2 .grp{display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--muted)}
.pill:hover{border-color:var(--gold);color:var(--ink)}

.ayah{display:grid;grid-template-columns:42px 1fr;gap:12px;padding-block:16px;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.ayah.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--gold-soft)}100%{background:transparent}}
.ayah .txt{min-width:0;font-size:var(--fs-read);line-height:1.85}
.ayah .tag{font-size:11.5px;color:var(--muted);margin-top:4px}
sup.fn{font-size:.62em;line-height:0}
sup.fn button{border:0;background:var(--gold);color:#fff;border-radius:6px;padding:1px 5px;margin:0 2px;font-weight:600;font-family:var(--f-body)}
.notes{margin-top:12px;background:var(--note);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.note{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:calc(var(--fs-read) - 2.5px);line-height:1.8;white-space:pre-line}
.note .k{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.note.hl{outline:2px solid var(--gold);outline-offset:4px;border-radius:4px}
.note .x{min-width:0;overflow-wrap:anywhere}

.pager{display:flex;justify-content:space-between;gap:10px;padding-block:22px 36px}
.pager button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager span{font-family:var(--f-display);font-size:16px}
.pager button[disabled]{visibility:hidden}

/* Download screen */
.dl{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding-block:40px}
.dl img{width:150px;height:150px;border-radius:32px;box-shadow:0 8px 30px rgba(11,90,58,.15);background:#FDFCF7}
.dl h1{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--title);margin:14px 0 0}
.dl p{color:var(--muted);margin:0;max-width:34ch}
.bar-p{width:min(320px,100%);height:8px;border-radius:99px;background:var(--gold-soft);overflow:hidden;margin-top:14px}
.bar-p i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.dl .num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:0;background:var(--green);color:var(--on-green);border-radius:12px;padding:10px 20px;margin-top:10px}
.err{color:var(--danger)}
.banner{background:var(--gold-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- storage: IndexedDB, falls back to memory ---------- */
const mem = new Map();
let dbp = null;
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("abm-hindi", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files");
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch { res(null); }
  });
  return dbp;
}
async function put(k, v) {
  mem.set(k, v);
  const d = await db(); if (!d) return;
  await new Promise(r => { try { const tx = d.transaction("files", "readwrite"); tx.objectStore("files").put(v, k); tx.oncomplete = r; tx.onerror = r; } catch { r(); } });
}
async function get(k) {
  if (mem.has(k)) return mem.get(k);
  const d = await db(); if (!d) return undefined;
  return new Promise(r => { try { const q = d.transaction("files").objectStore("files").get(k); q.onsuccess = () => { if (q.result !== undefined) mem.set(k, q.result); r(q.result); }; q.onerror = () => r(undefined); } catch { r(undefined); } });
}

/* ---------- network: own files first, then CDN, then GitHub raw ---------- */
let goodBase = null;
async function fetchText(path) {
  const order = goodBase ? [goodBase, ...BASES.filter(b => b !== goodBase)] : BASES;
  let last;
  for (const b of order) {
    try {
      const r = await fetch(b + path, { cache: "no-cache" });
      if (!r.ok) throw new Error(r.status);
      const t = await r.text();
      goodBase = b; return t;
    } catch (e) { last = e; }
  }
  throw last || new Error("network");
}
async function sha256(text) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch { return null; }
}

    <h1>मुख्तसर अहसनुल बयान</h1>
    <p id="dlmsg">${isUpdate ? "नया डेटा डाउनलोड हो रहा है…" : "पहली बार डेटा डाउनलोड हो रहा है। इसके बाद यह बिना इंटरनेट भी चलेगा।"}</p>
    <div class="bar-p" aria-hidden="true"><i id="dlbar"></i></div>
    <div class="num" id="dlnum">0%</div>
  </div>`);
  app.append(el);
  run();
  async function run() {
    const msg = el.querySelector("#dlmsg"), bar = el.querySelector("#dlbar"), num = el.querySelector("#dlnum");
    try {
      const mtext = await fetchText("manifest.json");
      const m = JSON.parse(mtext);
      let done = 0; const total = m.total_bytes;
      const queue = m.files.slice();
      const tick = () => { const p = total ? done / total : 0; bar.style.width = (p * 100).toFixed(1) + "%";
        num.textContent = `${Math.round(p * 100)}%  ·  ${(done / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`; };
      async function worker() {
        while (queue.length) {
          const f = queue.shift();
          const t = await fetchText(f.path);
          const h = await sha256(t);
          if (h && h !== f.sha256) throw new Error("hash " + f.path);
          await put(f.path, t);
          done += f.bytes; tick();
        }
      }
      await Promise.all(Array.from({ length: 6 }, worker));
      await put("manifest.json", mtext);
      boot();
    } catch (e) {
      msg.textContent = "डाउनलोड नहीं हो सका। इंटरनेट चेक करके दोबारा कोशिश करें।";
      msg.classList.add("err");
      const b = $(`<button class="btn" type="button">दोबारा कोशिश करें</button>`);
      b.onclick = () => downloadScreen(isUpdate);
      el.append(b);
    }
  }
}

/* ---------- home ---------- */
let homeTab = "surah", query = "";
function header(inner) { return `<header class="bar"><div class="wrap">${inner}</div></header>`; }
const ICON = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  search: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`,
};

function home() {
  location.hash !== "" && history.replaceState(null, "", location.pathname + location.search);
  app.innerHTML = header(`<img src="${LOGO}" alt=""><div class="grow"><h1>मुख्तसर अहसनुल बयान</h1><div class="sub">हिन्दी अनुवाद व तफ़सीर</div></div>`) +
  `<main class="wrap">
    <div id="upd"></div>
    <div class="tools">
      <label class="search"><span>${ICON.search}</span><input id="q" type="search" placeholder="सूरह का नाम या नंबर" value="${esc(query)}" aria-label="सूरह खोजें"></label>
      <div class="seg" role="group" aria-label="सूची">
        <button type="button" id="t-surah" aria-pressed="${homeTab === "surah"}">सूरह</button>
        <button type="button" id="t-juz" aria-pressed="${homeTab === "juz"}">पारा</button>
      </div>
    </div>
    <div class="label" id="lbl"></div>
    <div class="list" id="list"></div>
  </main>`;
  const q = app.querySelector("#q");
  q.oninput = () => { query = q.value; drawList(); };
  app.querySelector("#t-surah").onclick = () => { homeTab = "surah"; home(); };
  app.querySelector("#t-juz").onclick = () => { homeTab = "juz"; home(); };
  drawList();
  checkUpdate();
}

function drawList() {
  const list = app.querySelector("#list"), lbl = app.querySelector("#lbl");
  list.innerHTML = "";
  if (homeTab === "surah") {
    const k = query.trim().toLowerCase();
    const items = surahs.filter(s => !k || String(s.n) === k || s.name.toLowerCase().includes(k) || s.meaning.toLowerCase().includes(k));
    lbl.textContent = `${items.length} Surah · 6236 Ayat`;
    if (!items.length) list.append($(`<div class="empty">“${esc(query)}” से कोई सूरह नहीं मिली।</div>`));
    for (const s of items) {
      const b = $(`<button class="row" type="button">
        <span class="badge">${s.n}</span>
        <span class="t"><span class="n">${esc(s.name)}</span><br><span class="m">${esc(s.meaning)}</span></span>
        <span class="r"><span class="chip">${esc(s.place)}</span><br>${s.ayat_count} आयतें</span>
      </button>`);
      b.onclick = () => openSurah(s.n);
      list.append(b);
    }
  } else {
    lbl.textContent = "30 Para";
    juzIndex().then(idx => {
      for (const j of idx) {
        const s = surahs[j.s - 1];
        const b = $(`<button class="row" type="button">
          <span class="badge">${j.juz}</span>
          <span class="t"><span class="n">पारा ${j.juz}</span><br><span class="m">${esc(s.name)} · आयत ${j.a} से</span></span>
          <span class="r">पेज ${j.page}</span>
        </button>`);
        b.onclick = () => openSurah(j.s, j.a);
        list.append(b);
      }
    });
  }
}

let juzCache = null;
async function juzIndex() {
  if (juzCache) return juzCache;
  const out = []; let last = 0;
  for (const s of surahs) {
    const d = await loadSurah(s.n);
    for (const a of d.ayat) if (a.juz > last) { last = a.juz; out.push({ juz: a.juz, s: s.n, a: a.n, page: a.page }); }
    if (last >= 30) break;
  }
  return (juzCache = out);
}

async function checkUpdate() {
  try {
    const local = JSON.parse(await get("manifest.json"));
    const remote = JSON.parse(await fetchText("manifest.json"));
    if (remote.version > local.version) {
      const box = app.querySelector("#upd"); if (!box) return;
      const b = $(`<div class="banner"><span>नया डेटा उपलब्ध है (v${remote.version})</span><button class="pill" type="button">अपडेट करें</button></div>`);
      b.querySelector("button").onclick = () => downloadScreen(true);
      box.append(b);
    }
  } catch {}
}

/* ---------- reader ---------- */
const surahCache = new Map();
async function loadSurah(n) {
  if (surahCache.has(n)) return surahCache.get(n);
  const p = `surah/${String(n).padStart(3, "0")}.json`;
  let t = await get(p);
  if (t === undefined) { t = await fetchText(p); put(p, t); }
  const d = JSON.parse(t); surahCache.set(n, d); return d;
}

function fnText(a) {
  return esc(a.text).replace(/\[(\d+)\]/g, (_, k) => `<sup class="fn"><button type="button" data-k="${k}" aria-label="फ़ुटनोट ${k}">${k}</button></sup>`);
}

async function openSurah(n, scrollTo) {
  const s = surahs[n - 1];
  try { history.replaceState(null, "", "#s" + n); } catch {}
  app.innerHTML = header(`<button class="icon-btn" id="back" type="button" aria-label="वापस">${ICON.back}</button>
    <div class="grow"><h1>${esc(s.name)}</h1><div class="sub">सूरह ${n} · ${s.ayat_count} आयतें</div></div>
    <button class="toggle" id="tg" type="button" aria-pressed="${tafsir}"><span>तफ़सीर</span><span class="sw" aria-hidden="true"></span></button>`) +
    `<main class="wrap" id="rd"><div class="empty">लोड हो रहा है…</div></main>`;
  app.querySelector("#back").onclick = home;
  app.querySelector("#tg").onclick = (e) => { tafsir = !tafsir; ls.set("abm.tafsir", tafsir); e.currentTarget.setAttribute("aria-pressed", tafsir); drawAyat(); };
  window.scrollTo(0, 0);

  const d = await loadSurah(n);
  const rd = app.querySelector("#rd");
  rd.innerHTML = `<section class="head">
      <div class="ar">Surah ${n}</div>
      <h2>${esc(s.name)}</h2>
      <div class="m" style="color:var(--muted)">${esc(s.meaning)}</div>
      <div class="meta"><span class="chip">${esc(s.place)}</span><span class="chip">${s.ayat_count} आयतें</span><span class="chip">पारा ${s.juz}</span><span class="chip">पेज ${s.page}</span></div>
      <div class="orn"><i></i></div>
    </section>
    ${n !== 1 && n !== 9 ? `<div class="bism"><div class="a" lang="ar">${BISM_AR}</div><div class="h">अल्लाह के नाम से शुरू करता हूँ, जो बड़ा मेहरबान और रहम करने वाला है।</div></div>` : ""}
    <div class="tools2"><span class="grp" style="color:var(--muted);font-size:13px" id="mode"></span>
      <span class="grp"><button class="pill" id="fm" type="button" aria-label="अक्षर छोटे करें">A−</button><button class="pill" id="fp" type="button" aria-label="अक्षर बड़े करें">A+</button></span></div>
    <div id="ayat"></div>
    <nav class="pager">
      <button type="button" id="prev" ${n === 1 ? "disabled" : ""}><small>पिछली सूरह</small><span>${n > 1 ? esc(surahs[n - 2].name) : ""}</span></button>
      <button type="button" id="next" ${n === 114 ? "disabled" : ""}><small>अगली सूरह</small><span>${n < 114 ? esc(surahs[n].name) : ""}</span></button>
    </nav>`;
  rd.querySelector("#prev").onclick = () => n > 1 && openSurah(n - 1);
  rd.querySelector("#next").onclick = () => n < 114 && openSurah(n + 1);
  const setFs = (v) => { fs = Math.max(14, Math.min(26, v)); ls.set("abm.fs", fs); document.documentElement.style.setProperty("--fs-read", fs + "px"); };
  rd.querySelector("#fm").onclick = () => setFs(fs - 1);
  rd.querySelector("#fp").onclick = () => setFs(fs + 1);

  function drawAyat() {
    const box = rd.querySelector("#ayat");
    rd.querySelector("#mode").textContent = tafsir ? "अनुवाद + तफ़सीर" : "सिर्फ़ अनुवाद";
    box.innerHTML = d.ayat.map(a => `
      <article class="ayah" id="a${a.n}">
        <span class="badge">${a.n}</span>
        <div class="txt">
          <div>${tafsir ? fnText(a) : esc(a.translation)}</div>
          ${tafsir && a.notes.length ? `<div class="notes">${a.notes.map(x => `<div class="note" id="n${a.n}-${x.n}"><span class="k">${x.n}.</span><span class="x">${esc(x.text)}</span></div>`).join("")}</div>` : ""}
        </div>
      </article>`).join("");
    box.querySelectorAll("sup.fn button").forEach(b => b.onclick = () => {
      const art = b.closest(".ayah"); const el = art.querySelector(`#n${art.id.slice(1)}-${b.dataset.k}`);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 1600);
    });
  }
  drawAyat();
  if (scrollTo) { const el = rd.querySelector("#a" + scrollTo); if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("flash"); } }
}

/* ---------- boot ---------- */
async function boot() {
  const has = await get("manifest.json");
  if (!has) return downloadScreen(false);
  try { surahs = JSON.parse(await get("surahs.json")); } catch { return downloadScreen(false); }
  const m = /^#s(\d{1,3})$/.exec(location.hash);
  if (m && +m[1] >= 1 && +m[1] <= 114) openSurah(+m[1]); else home();
}
boot();
})();
</script>
